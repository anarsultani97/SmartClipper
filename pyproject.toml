[project]
name = "smartclipper-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2,<3",
    "alembic",
    "pydantic-settings",
    "authlib>=1.8.0",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "faster-whisper>=1.2.1",
    "pillow>=12.3.0",
    "numpy>=2.2.6",
    "httpx>=0.28.1",
    "filelock>=4.0.7",
    "opencv-python-headless>=4.13,<5",
    "yt-dlp[default]>=2026.8.19",
    "joserfc>=1.7.5",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/src/smartclipper_api"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api/src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
