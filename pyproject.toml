[project]
name = "smartclipper-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2,<3", "alembic", "pydantic-settings"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/src/smartclipper_api"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api/src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
